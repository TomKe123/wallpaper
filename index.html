                        <body>
                            <!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极简滚动时钟 - 上海宝山</title>
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #1a1a1a;
            --accent-color: #ffffff;
            --font-size: 340px;
            --digit-width: 220px;
            --digit-height: 400px;
            --digit-bg: rgba(255, 255, 255, 0.9);
            --digit-radius: 14px;
            --bing-image-url: url("https://www.bing.com/th?id=OHR.SpaceTrails_ZH-CN8377463217_1920x1080.jpg");
            --secondary-color: #555555;
            --line-height: 1.2;
        }

        * {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #1a1a1a;
            background-image: var(--bing-image-url);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-color);
            font-family: "HarmonyOS Sans SC", "Inter", "PingFang SC", "Microsoft YaHei", sans-serif;
            overflow: hidden;
            position: relative;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.25);
            z-index: 0;
            pointer-events: none;
        }

        body::before {
            display: none;
        }

        .clock-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
            transform: scale(0.68);
            gap: 50px;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.65);
            }
            to {
                opacity: 1;
                transform: scale(0.68);
            }
        }

        .info-header {
            display: flex;
            align-items: center;
            gap: 40px;
            justify-content: center;
            background: var(--digit-bg);
            border-radius: 50px;
            padding: 16px 44px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        #current-date-simple {
            font-size: 38px;
            font-weight: 500;
            letter-spacing: 10px;
            color: #1a1a1a;
            white-space: nowrap;
        }

        .weather-info-box {
            display: flex;
            align-items: center;
            gap: 18px;
            color: #444444;
            font-size: 24px;
            font-weight: 500;
            letter-spacing: 3px;
        }

        #weather-svg-container {
            width: 48px;
            height: 48px;
            fill: #333333;
            stroke: #333333;
        }

        #weather-svg-container svg {
            width: 100%;
            height: 100%;
        }

        .clock-main {
            display: flex;
            align-items: center;
            gap: 5px;
            position: relative;
            background: var(--digit-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 28px;
            padding: 28px 36px;
        }

        .digit-group {
            display: flex;
            gap: 3px;
        }

        .digit-container {
            width: var(--digit-width);
            height: var(--digit-height);
            border-radius: var(--digit-radius);
            overflow: hidden;
            position: relative;
            background: transparent;
            flex-shrink: 0;
        }

        .digit-strip {
            position: absolute;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            top: 0;
            left: 0;
            will-change: transform;
        }

        .digit {
            height: var(--digit-height);
            line-height: var(--digit-height);
            font-size: var(--font-size);
            font-weight: 900;
            text-align: center;
            width: 100%;
            color: #1a1a1a;
            background: transparent;
            display: block;
            letter-spacing: -2px;
            flex-shrink: 0;
        }

        .dot-separator {
            font-size: 100px;
            font-weight: 900;
            margin: 0 12px;
            padding: 0 10px 20px;
            color: #1a1a1a;
            background: transparent;
            flex-shrink: 0;
        }

        .footer-content {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            text-align: center;
        }

        #combined-greeting {
            font-size: 34px;
            font-weight: 500;
            color: #1a1a1a;
            letter-spacing: 8px;
            background: var(--digit-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 14px 60px;
            border-radius: 50px;
        }

        .quote-shell {
            width: min(980px, 86vw);
            min-height: 94px;
            padding: 20px 56px 18px 28px;
            position: relative;
            background: var(--digit-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 20px;
        }

        #quote-text {
            margin: 0;
            font-size: clamp(26px, 2.2vw, 24px);
            font-weight: 400;
            color: #2a2a2a;
            letter-spacing: 1.2px;
            line-height: 1.8;
            word-break: break-word;
            transition: opacity 0.35s ease;
        }

        .quote-shell.loading #quote-text,
        .quote-shell.loading #quote-source {
            opacity: 0.45;
        }

        #quote-text::before {
            content: "「";
            margin-right: 8px;
            opacity: 0.35;
        }

        #quote-text::after {
            content: "」";
            margin-left: 8px;
            opacity: 0.35;
        }

        #quote-source {
            margin-top: 10px;
            font-size: 22px;
            font-weight: 500;
            color: #3a3a3a;
            letter-spacing: 3px;
            transition: opacity 0.35s ease;
        }

        .quote-refresh-btn {
            position: absolute;
            bottom: 16px;
            right: 16px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid rgba(0, 0, 0, 0.12);
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .quote-refresh-btn:hover {
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
            transform: scale(1.05);
        }

        .quote-refresh-btn:active {
            transform: scale(0.94);
            transition: transform 0.1s ease;
        }

        .quote-refresh-btn svg {
            width: 20px;
            height: 20px;
            stroke: #444;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.2s ease;
        }

        .quote-refresh-btn:hover svg {
            stroke: #1a1a1a;
        }

        .quote-refresh-btn.spinning svg {
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 1280px) {
            :root {
                --font-size: 180px;
                --digit-width: 140px;
                --digit-height: 220px;
                --digit-radius: 10px;
            }
            .clock-container {
                gap: 20px;
            }
            .clock-main {
                padding: 18px 24px;
                border-radius: 20px;
            }
            .dot-separator {
                font-size: 60px;
                margin: 0 6px;
                padding: 0 6px 12px;
            }
            .info-header {
                padding: 12px 28px;
                gap: 24px;
            }
            #current-date-simple {
                font-size: 26px;
                letter-spacing: 6px;
            }
            .weather-info-box {
                font-size: 18px;
            }
            #combined-greeting {
                font-size: 22px;
                padding: 10px 36px;
                letter-spacing: 4px;
            }
            .quote-shell {
                padding: 18px 50px 16px 24px;
            }
            #quote-source {
                font-size: 17px;
                letter-spacing: 2px;
            }
            .quote-refresh-btn {
                width: 36px;
                height: 36px;
                bottom: 12px;
                right: 12px;
            }
            .quote-refresh-btn svg {
                width: 18px;
                height: 18px;
            }
        }

        @media (max-width: 960px) {
            :root {
                --font-size: 112px;
                --digit-width: 88px;
                --digit-height: 140px;
                --digit-radius: 8px;
            }
            .clock-container {
                gap: 12px;
            }
            .clock-main {
                padding: 12px 14px;
                border-radius: 16px;
                gap: 2px;
            }
            .info-header {
                flex-direction: column;
                gap: 10px;
                width: 90%;
                padding: 12px 20px;
                border-radius: 30px;
            }
            #current-date-simple {
                font-size: 20px;
                letter-spacing: 5px;
            }
            .weather-info-box {
                font-size: 16px;
                letter-spacing: 2px;
            }
            #weather-svg-container {
                width: 32px;
                height: 32px;
            }
            .dot-separator {
                font-size: 38px;
                margin: 0 3px;
                padding: 0 4px 8px;
            }
            #combined-greeting {
                font-size: 16px;
                padding: 8px 24px;
                letter-spacing: 3px;
                border-radius: 30px;
            }
            .quote-shell {
                padding: 14px 44px 12px 18px;
                border-radius: 14px;
                min-height: 60px;
            }
            #quote-text {
                font-size: 15px;
                letter-spacing: 0.6px;
            }
            #quote-source {
                font-size: 13px;
                letter-spacing: 2px;
            }
            .quote-refresh-btn {
                width: 32px;
                height: 32px;
                bottom: 10px;
                right: 10px;
            }
            .quote-refresh-btn svg {
                width: 16px;
                height: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="clock-container">
        <div class="info-header">
            <div id="current-date-simple">4月12日 星期日</div>
            <div class="weather-info-box">
                <span id="city-name">上海宝山</span>
                <span id="weather-svg-container"></span>
                <span id="weather-temp-new">--°C</span>
            </div>
        </div>

        <div class="clock-main">
            <div class="digit-group">
                <div class="digit-container"><div class="digit-strip" id="h-1"></div></div>
                <div class="digit-container"><div class="digit-strip" id="h-2"></div></div>
            </div>
            <div class="dot-separator">:</div>
            <div class="digit-group">
                <div class="digit-container"><div class="digit-strip" id="m-1"></div></div>
                <div class="digit-container"><div class="digit-strip" id="m-2"></div></div>
            </div>
            <div class="dot-separator">:</div>
            <div class="digit-group">
                <div class="digit-container"><div class="digit-strip" id="s-1"></div></div>
                <div class="digit-container"><div class="digit-strip" id="s-2"></div></div>
            </div>
        </div>

        <div class="footer-content">
            <div id="combined-greeting">专注此刻，时间会给努力最好的答案</div>
            <div class="quote-shell" id="quote-shell">
                <p id="quote-text">获取精彩内容…</p>
                <div id="quote-source">—— 每日一言</div>
                <button class="quote-refresh-btn" id="quote-refresh-btn"
                        title="换一言" aria-label="刷新语录">
                    <svg viewBox="0 0 24 24">
                        <polyline points="23 4 23 10 17 10"></polyline>
                        <polyline points="1 20 1 14 7 14"></polyline>
                        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        (function () {
            const WallpaperClock = {
                strips: ["h-1", "h-2", "m-1", "m-2", "s-1", "s-2"],
                stripMaxValue: {
                    "h-1": 2,
                    "h-2": 9,
                    "m-1": 5,
                    "m-2": 9,
                    "s-1": 5,
                    "s-2": 9
                },
                digitTransitionMs: 600,
                bingMetaApiUrl:
                    "https://www.bing.com/HPImageArchive.aspx?format=js&idx=0&n=1&mkt=zh-CN",
                bingFallbackImageUrl:
                    "https://bing.biturl.top/?resolution=1920&format=image&index=0&mkt=zh-CN",
                bingImageUrl:
                    "https://www.bing.com/th?id=OHR.SpaceTrails_ZH-CN8377463217_1920x1080.jpg",

                clockTimerId: null,
                lastKnownDigitHeight: null,
                resizeRAFId: null,
                needsRecalibration: false,
                isQuoteLoading: false,

                weatherSVGs: {
                    clear_day:
                        '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="none" stroke="#333" stroke-width="2"/><g stroke="#333" stroke-width="2" stroke-linecap="round"><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></g></svg>',
                    cloudy:
                        '<svg viewBox="0 0 24 24"><path d="M19.35 10.04A7.49 7.49 0 0 0 12 4C9.11 4 6.6 5.64 5.35 8.04A5.994 5.994 0 0 0 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z" fill="#555" stroke="none"/></svg>',
                    rain:
                        '<svg viewBox="0 0 24 24"><path d="M19.35 10.04A7.49 7.49 0 0 0 12 4C9.11 4 6.6 5.64 5.35 8.04A5.994 5.994 0 0 0 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z" fill="#555"/><g fill="#333"><circle cx="16" cy="17" r="1.5"/><circle cx="12" cy="19" r="1.5"/><circle cx="8" cy="17" r="1.5"/></g></svg>',
                    snow:
                        '<svg viewBox="0 0 24 24"><path d="M19.35 10.04A7.49 7.49 0 0 0 12 4C9.11 4 6.6 5.64 5.35 8.04A5.994 5.994 0 0 0 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z" fill="#555"/><g fill="#333"><circle cx="12" cy="19" r="1.5"/><circle cx="9" cy="16" r="1.5"/><circle cx="15" cy="16" r="1.5"/></g></svg>'
                },

                quoteApiUrl: "https://v1.hitokoto.cn/?c=c",
                allowedSources: ["原神", "崩坏：星穹铁道", "崩坏3"],
                maxRetries: 8,
                retryDelayMs: 250,
                apiTimeoutMs: 1800,

                /* 本地兜底语录库：每条包含 text 和 source（游戏名） */
                mihoyoQuotes: [
                    { text: "旅途的意义，就是不断遇见新的风景。", source: "原神" },
                    { text: "当你重新踏上旅途之后，一定要记得旅途本身的意义。", source: "原神" },
                    { text: "风带来了故事的种子，时间使其发芽。", source: "原神" },
                    { text: "在永恒中寻找变化，在变化中寻找永恒。", source: "原神" },
                    { text: "只要不失去你的崇高，整个世界都会为你敞开。", source: "原神" },
                    { text: "不要害怕犯错，那是成长的必经之路。", source: "原神" },
                    { text: "愿此行，终抵群星。", source: "崩坏：星穹铁道" },
                    { text: "宇宙很大，生活更大。", source: "崩坏：星穹铁道" },
                    { text: "开拓者，不必匆忙，一步一步走就好。", source: "崩坏：星穹铁道" },
                    { text: "规则，就是用来打破的。", source: "崩坏：星穹铁道" },
                    { text: "列车前进的方向，就是家的方向。", source: "崩坏：星穹铁道" },
                    { text: "每个人的心里都住着一个英雄。", source: "崩坏：星穹铁道" },
                    { text: "为世界上所有的美好而战。", source: "崩坏3" },
                    { text: "我将坠入黑暗，换你回到光明。", source: "崩坏3" },
                    { text: "活着，就是一场盛大的战斗。", source: "崩坏3" },
                    { text: "痛苦教会我们珍惜，失去教会我们守护。", source: "崩坏3" },
                    { text: "终点并不重要，重要的是沿途的风景与同伴。", source: "原神" },
                    { text: "奇迹从来不是等来的，是拼出来的。", source: "崩坏：星穹铁道" },
                    { text: "未知并不可怕，可怕的是失去探索的勇气。", source: "崩坏：星穹铁道" },
                    { text: "即使身处黑暗，也要心向光明。", source: "崩坏3" },
                    { text: "出发吧，去追寻属于你的星辰。", source: "原神" },
                    { text: "所谓成长，就是不断告别过去的自己。", source: "原神" },
                    { text: "如果停下来，就永远到不了想去的地方。", source: "崩坏：星穹铁道" },
                    { text: "战斗不是为了一时的胜利，而是为了守护珍视之物。", source: "崩坏3" },
                    { text: "时间不会等待，但我们可以选择如何度过。", source: "原神" },
                    { text: "所有的相遇，都是久别重逢。", source: "原神" },
                    { text: "向着星辰与深渊，前进吧。", source: "原神" },
                    { text: "空洞虽险，但机遇并存。", source: "绝区零" },
                    { text: "在这个世界活下去，本身就是一种奇迹。", source: "绝区零" },
                    { text: "每一天都是崭新的冒险。", source: "绝区零" }
                ],

                init() {
                    this.initializeStrips();
                    this.applyBingImageToStyles(this.bingImageUrl);
                    this.bindRefreshButton();
                    this.refreshQuote();
                    this.updateWeather();
                    this.startLoops();
                    this.refreshBingImage();

                    window.addEventListener("resize", () => this.onResize());

                    requestAnimationFrame(() => {
                        requestAnimationFrame(() => {
                            this.lastKnownDigitHeight = this.readDigitHeightFromCSS();
                            this.updateClock();
                        });
                    });
                },

                bindRefreshButton() {
                    const btn = document.getElementById("quote-refresh-btn");
                    if (!btn) return;
                    btn.removeEventListener("click", this._onRefreshClick);
                    this._onRefreshClick = (e) => {
                        e.preventDefault();
                        this.refreshQuote();
                    };
                    btn.addEventListener("click", this._onRefreshClick);
                },

                initializeStrips() {
                    this.strips.forEach((id) => {
                        const strip = document.getElementById(id);
                        if (!strip) return;
                        strip.innerHTML = "";
                        const maxValue = this.stripMaxValue[id] ?? 9;
                        for (let i = 0; i <= maxValue + 1; i++) {
                            const div = document.createElement("div");
                            div.className = "digit";
                            div.textContent = i <= maxValue ? i : 0;
                            strip.appendChild(div);
                        }
                    });
                },

                applyBingImageToStyles(imageUrl) {
                    if (!imageUrl) return;
                    document.documentElement.style.setProperty(
                        "--bing-image-url",
                        `url("${String(imageUrl).replace(/"/g, '\\"')}")`
                    );
                },

                resolveOfficialBingImageUrl(payload) {
                    const image = payload?.images?.[0];
                    if (!image) return "";
                    if (image.urlbase) {
                        return `https://www.bing.com${image.urlbase}_1920x1080.jpg`;
                    }
                    if (image.url) {
                        return image.url.startsWith("http")
                            ? image.url
                            : `https://www.bing.com${image.url}`;
                    }
                    return "";
                },

                setBingImage(url) {
                    if (!url || url === this.bingImageUrl) return;
                    this.bingImageUrl = url;
                    this.applyBingImageToStyles(this.bingImageUrl);
                },

                useFallbackBingImage() {
                    this.setBingImage(this.bingFallbackImageUrl);
                },

                async refreshBingImage() {
                    try {
                        const response = await fetch(this.bingMetaApiUrl);
                        if (!response.ok)
                            throw new Error(`HTTP ${response.status}`);
                        const payload = await response.json();
                        const officialUrl =
                            this.resolveOfficialBingImageUrl(payload);
                        if (!officialUrl) throw new Error("官方图片地址为空");
                        this.setBingImage(officialUrl);
                    } catch (_err) {
                        this.useFallbackBingImage();
                    }
                },

                readDigitHeightFromCSS() {
                    const raw = getComputedStyle(document.documentElement)
                        .getPropertyValue("--digit-height")
                        .trim();
                    const parsed = parseFloat(raw);
                    if (parsed > 0 && Number.isFinite(parsed)) {
                        return parsed;
                    }
                    const digit = document.querySelector(".digit");
                    if (digit && digit.offsetHeight > 0) {
                        return digit.offsetHeight;
                    }
                    return 400;
                },

                getDigitHeight() {
                    if (
                        this.lastKnownDigitHeight &&
                        this.lastKnownDigitHeight > 0
                    ) {
                        return this.lastKnownDigitHeight;
                    }
                    const h = this.readDigitHeightFromCSS();
                    this.lastKnownDigitHeight = h;
                    return h;
                },

                onResize() {
                    if (this.resizeRAFId) {
                        cancelAnimationFrame(this.resizeRAFId);
                    }
                    this.resizeRAFId = requestAnimationFrame(() => {
                        this.resizeRAFId = null;
                        const newHeight = this.readDigitHeightFromCSS();
                        if (newHeight !== this.lastKnownDigitHeight) {
                            this.lastKnownDigitHeight = newHeight;
                            this.needsRecalibration = true;
                            this.updateClock(true);
                        }
                    });
                },

                forceRecalibrateAllStrips() {
                    this.strips.forEach((id) => {
                        const strip = document.getElementById(id);
                        if (strip) {
                            delete strip.dataset.prev;
                            strip.style.transition = "none";
                        }
                    });
                    this.needsRecalibration = false;
                },

                updateDigit(id, value, height) {
                    const strip = document.getElementById(id);
                    if (!strip) return;
                    const valueText = String(value);
                    if (strip.dataset.prev === valueText) return;

                    const previousText = strip.dataset.prev;
                    const previousValue =
                        previousText == null ? null : Number(previousText);
                    const maxValue = this.stripMaxValue[id] ?? 9;
                    const transition = `transform ${
                        this.digitTransitionMs
                    }ms cubic-bezier(0.65, 0, 0.35, 1)`;

                    if (previousValue == null) {
                        strip.style.transition = "none";
                        strip.style.transform = `translateY(-${
                            value * height
                        }px)`;
                        strip.dataset.prev = valueText;
                        return;
                    }

                    const isCarryStep =
                        previousValue === maxValue && value === 0;
                    if (isCarryStep) {
                        strip.style.transition = transition;
                        strip.style.transform = `translateY(-${
                            (maxValue + 1) * height
                        }px)`;
                        setTimeout(() => {
                            strip.style.transition = "none";
                            strip.style.transform = "translateY(0px)";
                        }, this.digitTransitionMs);
                    } else {
                        strip.style.transition = transition;
                        strip.style.transform = `translateY(-${
                            value * height
                        }px)`;
                    }
                    strip.dataset.prev = valueText;
                },

                updateClock(forceRecalibrate) {
                    if (this.clockTimerId) {
                        clearTimeout(this.clockTimerId);
                        this.clockTimerId = null;
                    }

                    const now = new Date();
                    const hours = String(now.getHours()).padStart(2, "0");
                    const minutes = String(now.getMinutes()).padStart(2, "0");
                    const seconds = String(now.getSeconds()).padStart(2, "0");

                    const month = now.getMonth() + 1;
                    const day = now.getDate();
                    const weekDays = [
                        "星期日",
                        "星期一",
                        "星期二",
                        "星期三",
                        "星期四",
                        "星期五",
                        "星期六"
                    ];
                    const weekName = weekDays[now.getDay()];
                    const dateEl = document.getElementById(
                        "current-date-simple"
                    );
                    if (dateEl) {
                        dateEl.textContent = `${month}月${day}日 ${weekName}`;
                    }

                    const hour = now.getHours();
                    let greeting = "";
                    if (hour >= 5 && hour < 7) {
                        greeting =
                            "朝霞初染，清晨的专注是对自己最好的投资";
                    } else if (hour >= 7 && hour < 8) {
                        greeting = "早安，晨间十分钟抵得过深夜一小时";
                    } else if (hour >= 8 && hour < 12) {
                        greeting = "深度思考，每一道难题都是认知的阶梯";
                    } else if (hour >= 12 && hour < 13) {
                        greeting = "午间小憩，给大脑一次优雅的重启";
                    } else if (hour >= 13 && hour < 17) {
                        greeting = "攻坚时刻，所有专注终将点石成金";
                    } else if (hour >= 17 && hour < 20) {
                        greeting =
                            "暮色温书，让知识在灯火下悄然生长";
                    } else if (hour >= 20 && hour < 23) {
                        greeting =
                            "温故知新，沉淀今日所学，静待明日花开";
                    } else {
                        greeting =
                            "静夜深研，世界沉睡之处正是梦想生长之地";
                    }
                    const greetingEl = document.getElementById(
                        "combined-greeting"
                    );
                    if (greetingEl) {
                        greetingEl.textContent = greeting;
                    }

                    const digitHeight = this.getDigitHeight();

                    if (forceRecalibrate || this.needsRecalibration) {
                        this.forceRecalibrateAllStrips();
                    }

                    this.updateDigit("h-1", Number(hours[0]), digitHeight);
                    this.updateDigit("h-2", Number(hours[1]), digitHeight);
                    this.updateDigit("m-1", Number(minutes[0]), digitHeight);
                    this.updateDigit("m-2", Number(minutes[1]), digitHeight);
                    this.updateDigit("s-1", Number(seconds[0]), digitHeight);
                    this.updateDigit("s-2", Number(seconds[1]), digitHeight);

                    const msUntilNextSecond =
                        1000 - now.getMilliseconds();
                    this.clockTimerId = setTimeout(
                        () => this.updateClock(),
                        msUntilNextSecond
                    );
                },

                setRefreshSpinning(spinning) {
                    const btn = document.getElementById("quote-refresh-btn");
                    if (!btn) return;
                    btn.classList.toggle("spinning", Boolean(spinning));
                },

                getRandomMihoyoQuote() {
                    const idx = Math.floor(
                        Math.random() * this.mihoyoQuotes.length
                    );
                    return this.mihoyoQuotes[idx];
                },

                /* ─── 渲染语录：同时显示正文与出处 ─── */
                renderQuote(text, source) {
                    const quoteTextEl = document.getElementById("quote-text");
                    const quoteSourceEl = document.getElementById("quote-source");
                    if (!quoteTextEl || !quoteSourceEl) return;
                    quoteTextEl.textContent =
                        text || "此时此刻，就是最好的时刻。";
                    quoteSourceEl.textContent = `—— ${source || "每日一言"}`;
                },

                normalizeSource(str) {
                    return (str || "").replace(/：/g, ":").trim();
                },

                isSourceAllowed(from) {
                    const normalizedFrom = this.normalizeSource(from);
                    return this.allowedSources.some(
                        (s) => this.normalizeSource(s) === normalizedFrom
                    );
                },

                /* ─── 从 API 获取，并返回 { text, fromWho } ─── */
                async fetchMihoyoQuoteFromApi(retriesLeft) {
                    const remaining =
                        retriesLeft != null
                            ? retriesLeft
                            : this.maxRetries;

                    if (remaining <= 0) {
                        return null;
                    }

                    try {
                        const controller = new AbortController();
                        const timeoutId = setTimeout(
                            () => controller.abort(),
                            this.apiTimeoutMs
                        );

                        const response = await fetch(this.quoteApiUrl, {
                            signal: controller.signal
                        });
                        clearTimeout(timeoutId);

                        if (!response.ok) {
                            throw new Error(`HTTP ${response.status}`);
                        }

                        const data = await response.json();
                        const from = (data.from || "").trim();

                        if (from && this.isSourceAllowed(from)) {
                            /* 
                              优先级：
                              1. from_who (角色名/发言人) 
                              2. from (游戏名) 
                              3. 空字符串
                            */
                            const fromWho = (
                                data.from_who ||
                                data.from ||
                                ""
                            ).trim();
                            return {
                                text: data.hitokoto || "",
                                fromWho: fromWho || from
                            };
                        }

                        await new Promise((r) =>
                            setTimeout(r, this.retryDelayMs)
                        );
                        return this.fetchMihoyoQuoteFromApi(remaining - 1);
                    } catch (_err) {
                        await new Promise((r) =>
                            setTimeout(r, this.retryDelayMs)
                        );
                        return this.fetchMihoyoQuoteFromApi(remaining - 1);
                    }
                },

                async refreshQuote() {
                    if (this.isQuoteLoading) return;
                    this.isQuoteLoading = true;

                    const quoteShell = document.getElementById("quote-shell");
                    if (quoteShell) quoteShell.classList.add("loading");
                    this.setRefreshSpinning(true);

                    const startTime = Date.now();

                    let quote = null;

                    try {
                        quote = await this.fetchMihoyoQuoteFromApi();
                    } catch (_e) {
                        quote = null;
                    }

                    /* 决定最终显示的文本和出处 */
                    let displayText = "";
                    let displaySource = "";

                    if (quote && quote.text) {
                        /* API 成功 */
                        displayText = quote.text;
                        displaySource = quote.fromWho || "每日一言";
                    } else {
                        /* 降级到本地库 */
                        const local = this.getRandomMihoyoQuote();
                        displayText = local.text;
                        displaySource = local.source;
                    }

                    this.renderQuote(displayText, displaySource);

                    const elapsed = Date.now() - startTime;
                    const minSpinMs = 300;
                    if (elapsed < minSpinMs) {
                        await new Promise((r) =>
                            setTimeout(r, minSpinMs - elapsed)
                        );
                    }

                    if (quoteShell) quoteShell.classList.remove("loading");
                    this.setRefreshSpinning(false);
                    this.isQuoteLoading = false;
                },

                async updateWeather() {
                    try {
                        const response = await fetch(
                            "https://api.open-meteo.com/v1/forecast?latitude=31.4053&longitude=121.4894&current_weather=true"
                        );
                        if (!response.ok)
                            throw new Error(`HTTP ${response.status}`);
                        const data = await response.json();
                        const code = data.current_weather.weathercode;
                        const temp = Math.round(
                            data.current_weather.temperature
                        );

                        const cityEl = document.getElementById("city-name");
                        const tempEl = document.getElementById(
                            "weather-temp-new"
                        );
                        const iconEl = document.getElementById(
                            "weather-svg-container"
                        );
                        if (cityEl) cityEl.textContent = "上海宝山";
                        if (tempEl) tempEl.textContent = `${temp}°C`;

                        let iconKey = "clear_day";
                        if (code >= 71) iconKey = "snow";
                        else if (code >= 51) iconKey = "rain";
                        else if (code >= 2) iconKey = "cloudy";

                        if (iconEl)
                            iconEl.innerHTML = this.weatherSVGs[iconKey];
                    } catch (_err) {
                        const tempEl = document.getElementById(
                            "weather-temp-new"
                        );
                        if (tempEl) tempEl.textContent = "--°C";
                    }
                },

                startLoops() {
                    setInterval(() => this.refreshQuote(), 60 * 60 * 1000);
                    setInterval(() => this.updateWeather(), 30 * 60 * 1000);
                    setInterval(() => this.refreshBingImage(), 6 * 60 * 60 * 1000);
                }
            };

            if (document.readyState === "complete") {
                WallpaperClock.init();
            } else {
                window.addEventListener("load", () => WallpaperClock.init());
            }
        })();
    </script>
